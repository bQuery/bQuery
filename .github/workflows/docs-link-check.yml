name: Docs link check

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'docs/**'
      - '.github/workflows/docs-link-check.yml'
      - 'lychee.toml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'docs/**'
      - '.github/workflows/docs-link-check.yml'
      - 'lychee.toml'
  schedule:
    # Weekly check of external links — Monday 06:00 UTC.
    - cron: '0 6 * * 1'

jobs:
  link-check:
    name: Lychee
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --config lychee.toml --no-progress 'docs/**/*.md'
          # Report broken links without failing the workflow (`fail: false`).
          # `docs:check` separately audits whether exported APIs are mentioned
          # in the docs corpus.
          fail: false
          jobSummary: true
