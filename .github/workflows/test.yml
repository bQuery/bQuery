name: Test
permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check tests
        run: bun run test:types

      - name: Run tests
        run: bun test

  # Build-dependent checks. `bun run build` is the expensive part, so
  # anything else needing a current `dist/` — the `package` job from #218,
  # `check:package` from #220 — belongs as a step here rather than as its
  # own job that repeats the checkout, install and build. Whichever of those
  # lands second should fold into this job.
  size:
    name: Build-dependent checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Measures the transitive cost of each public entry point against the
      # budgets in scripts/bundle-budgets.mjs (#216).
      - name: Check bundle size budgets
        run: bun run check:size
